<!DOCTYPE html>
<html lang="eng">
	<head>
	<title>Box Model Practice</title>
	<script scr="../validate.js"></script>
	<style>
		#redbox{
		background-color:red;
		height:50px;
		width:50px;
		margin-left:250px;
	}

		#bluebox{
		background-color:blue;
		height:50px;
		width:50px;
		padding:50px;
		border:2px black solid;
		background-clip:content-box;
		margin-left:300px;
	}
		#greenbox{
		background-color:green;
		height:50px;
		width:50px;
		padding-left:25px;
		background-clip:content-box;
		border:2px black solid;

	}
		#yellowbox{
                background-color:yellow;
                height:50px;
                width:50px;
                padding-left:25px;
		padding-right:25px;
		padding-top:35px;
		margin-left:250px;
                background-clip:content-box;
                border:2px black solid;

        }      	
		#purplebox{
                background-color:purple;
                height:50px;
                width:50px;
                padding-bottom:50px;
                margin-left:200px;
                background-clip:content-box;
                border:2px black solid;

        }
	
	</style>
	</head>
	<body>
		<h1>Look at dem boxes</h1>
		<div id="redbox"></div>
		<div id="bluebox"></div>
		<div id="greenbox"></div>
		<div id="yellowbox"></div>
                <div id="purplebox"></div>
	</body>

</html>
